[project]
name = "soap-jax"
version = "0.1.0+sled"
description = "SOAP optimizer in JAX (soap-jax v0.1.0 with the changes listed in README.md)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["jax", "jaxtyping", "optax"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
